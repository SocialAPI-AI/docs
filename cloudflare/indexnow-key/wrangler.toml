# Serves the IndexNow key on docs.social-api.ai. Mintlify serves .txt files on
# Enterprise plans only, so our Cloudflare zone answers this one path instead.
# Deploy: npx wrangler deploy (from this directory)
name = "docs-indexnow-key"
main = "index.js"
compatibility_date = "2026-02-27"
workers_dev = false
routes = [
  { pattern = "docs.social-api.ai/da05966f77cb431ba58254feae63d3af.txt", zone_name = "social-api.ai" },
]
